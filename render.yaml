# Render Blueprint: New -> Blueprint -> pick this repo. Render asks for the
# values marked "sync: false" during setup.
services:
  - type: web
    name: rental-platform
    runtime: python
    plan: starter # a persistent disk needs a paid instance
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    # One worker: SQLite and the in-memory login throttle assume a single process.
    startCommand: gunicorn app:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    disk:
      name: rental-platform-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: RENTAL_DATA_DIR
        value: /var/data
      - key: RENTAL_BEHIND_PROXY
        value: "true"
      - key: RENTAL_DEBUG
        value: "false"
      - key: RENTAL_SECRET_KEY
        generateValue: true
      - key: RENTAL_OWNER_EMAIL
        sync: false
      - key: RENTAL_OWNER_PASSWORD
        sync: false
      - key: RENTAL_FROM_EMAIL
        sync: false
      - key: RENTAL_SMTP_HOST
        value: smtp.gmail.com
      - key: RENTAL_SMTP_PORT
        value: "587"
      - key: RENTAL_SMTP_USE_TLS
        value: "true"
      - key: RENTAL_SMTP_USERNAME
        sync: false
      - key: RENTAL_SMTP_PASSWORD
        sync: false
