<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mahebourg Lagoon Kayak Rentals{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Rent a kayak on the turquoise Mahebourg Lagoon, Mauritius. Book online in a minute, pay on arrival. Life jackets and dry bag included.{% endblock %}">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.meta_description() }}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ request.url_root.rstrip('/') }}{{ url_for('assets', filename='MountLion.jpeg') }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#007b83">
  {% block robots %}{% endblock %}
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛶</text></svg>">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
