{% extends "base.html" %}

{% block title %}Owner login — Mahebourg Kayak{% endblock %}

{% block body_class %}plain-page{% endblock %}

{% block body %}
  <main class="login-page">
    {% include "_flash.html" %}
    <section class="login-card">
      <p class="eyebrow">Owner dashboard</p>
      <h1>Sign in</h1>
      <form method="post" class="login-form">
        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
        <label>
          Email
          <input required name="email" type="email" autocomplete="username" autofocus>
        </label>
        <label>
          Password
          <input required name="password" type="password" autocomplete="current-password">
        </label>
        <button class="button primary" type="submit">Sign in</button>
      </form>
    </section>
  </main>
{% endblock %}

{% block scripts %}
  <script defer src="{{ url_for('static', filename='app.js') }}"></script>
{% endblock %}
